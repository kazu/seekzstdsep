name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  # One plugin build serves one nushell minor.
  NU_VERSION: 0.116.0

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust 1.96.1
      run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt
    - name: Select Rust 1.96.1
      run: rustup default 1.96.1
    - uses: Swatinem/rust-cache@v2
      with:
        # The gate also builds the bench crate, which has a target directory of its own.
        workspaces: |
          . -> target
          bench -> target
    - name: Run the gate
      run: make ci

  hook:
    # nu_plugin_zstdsep/tests/hook.nu drives a real nushell rather than the plugin
    # test harness, so it needs the matching nu on PATH and a built plugin.

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust 1.96.1
      run: rustup toolchain install 1.96.1 --profile minimal
    - name: Select Rust 1.96.1
      run: rustup default 1.96.1
    - uses: Swatinem/rust-cache@v2
    - name: Install nushell
      run: |
        name=nu-${NU_VERSION}-x86_64-unknown-linux-gnu
        curl -fsSL "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${name}.tar.gz" | tar xz -C /tmp
        echo "/tmp/${name}" >> "$GITHUB_PATH"
    - name: Run the hook tests
      run: make hook
