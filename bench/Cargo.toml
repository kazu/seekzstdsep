# Own workspace root on purpose: the parent crate's Cargo.toml is left untouched.
[workspace]

[package]
name = "szbench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
seekzstdsep = { path = ".." }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
memchr = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeekstd = "0.6.2"
zstd = "0.13"

[profile.release]
opt-level = 3
